domain: card-credit.apps.drgdevlab.com

image:
  frontend:
    tag: 4bf19a23f1aee1808112f2188e1514e98e27cd26@sha256:0a00ca37bc52c1d3a4e88ebcc3530be1b140d28b6e55bc2463388427418fcba9
    repository: ghcr.io/devsecopslonghn/card-credit-fe
  backend:
    tag: 92999165ea560bdcd3aadab971a29845750bde26@sha256:b8dd427ba14d34df3a88775068588f780a951684910e127d3a0bdb1ce2867f6d
    repository: ghcr.io/devsecopslonghn/card-credit-be
  pullPolicy: IfNotPresent

runtimeSecret: card-credit-runtime
imagePullSecret: ghcr-pull

observability:
  enabled: true
  endpoint: http://collector.observability-dev.svc.cluster.local:4317
  environment: dev
  traceSampling: "0.10"

# Canonical MCP mutation traffic is explicitly enabled by DECISION-MCP-WRITE-01.
# The application still requires the old-writer fence acknowledgement and
# keeps preview/confirm/idempotency/audit guards in the backend.
mcp:
  writerMode: write
  oldWriterFenced: true
  queryTrace: false

frontend:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

backend:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

dataIntegrityMigration:
  # Explicit release operation after native DB backup; security syncs must not run DDL.
  enabled: false
  backoffLimit: 0
  activeDeadlineSeconds: 120
